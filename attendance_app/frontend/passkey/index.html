<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Device Verification</title>
    <style>
      body {
        margin: 0;
        font-family: "Noto Kufi Arabic", "Tahoma", "Space Grotesk", "Segoe UI", sans-serif;
        background: transparent;
        color: #f4f7fb;
      }
      .panel {
        border: 1px solid #253140;
        border-radius: 14px;
        background: #0f141c;
        padding: 14px;
      }
      button {
        width: 100%;
        border: none;
        border-radius: 10px;
        background: #c7f36b;
        color: #121807;
        padding: 12px 14px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #d4ff7b; }
      button:disabled { opacity: 0.7; cursor: wait; }
      p { margin: 10px 0 0; font-size: 13px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div class="panel">
      <button id="passkeyButton" type="button">Verify this device</button>
      <p id="statusText">Secure verification confirms this registered device.</p>
    </div>
    <script>
      const button = document.getElementById("passkeyButton");
      const statusText = document.getElementById("statusText");
      let componentArgs = null;
      let locale = "en";
      let reportedCapabilityOperation = null;
      let runningOperation = null;
      const messages = {
        en: {
          register: "Use Face ID, fingerprint, or PIN",
          verify: "Confirm with Face ID, fingerprint, or PIN",
          browserVerify: "Verify this registered device",
          registerDescription: "Use this device's normal screen lock. No USB key is required.",
          verifyDescription: "Use the same passkey or screen lock you registered before.",
          browserCredentialMissing: "The secure credential stored in this browser is missing.",
          unsupported: "Secure device verification is not supported on this device.",
          browserUnsupported: "Secure device storage is not supported on this device.",
          checking: "Checking device compatibility...",
          waiting: "Waiting for device confirmation...",
          verified: "Device verified.",
          failed: "Device verification failed.",
          incomplete: "Device verification was not completed.",
        },
        ar: {
          register: "استخدم بصمة الوجه أو الإصبع أو PIN",
          verify: "أكّد ببصمة الوجه أو الإصبع أو PIN",
          browserVerify: "التحقق من الجهاز المسجل",
          registerDescription: "استخدم قفل الشاشة المعتاد لهذا الجهاز. لا تحتاج إلى مفتاح USB.",
          verifyDescription: "استخدم مفتاح المرور أو قفل الشاشة الذي سجلته سابقاً.",
          browserCredentialMissing: "بيانات الحماية المحفوظة في هذا المتصفح غير موجودة.",
          unsupported: "هذا الجهاز لا يدعم التحقق الآمن من الجهاز.",
          browserUnsupported: "هذا الجهاز لا يدعم التخزين الآمن لبيانات الجهاز.",
          checking: "جارٍ التحقق من توافق الجهاز...",
          waiting: "بانتظار تأكيد الجهاز...",
          verified: "تم التحقق من الجهاز.",
          failed: "تعذر التحقق من الجهاز.",
          incomplete: "لم يكتمل التحقق من الجهاز.",
        },
      };

      function copy(key) {
        return messages[locale][key];
      }

      function send(type, data) {
        window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), "*");
      }

      function setValue(value) {
        send("streamlit:setComponentValue", { value });
      }

      function setHeight() {
        send("streamlit:setFrameHeight", { height: document.body.scrollHeight });
      }

      function base64url(buffer) {
        const bytes = new Uint8Array(buffer);
        let value = "";
        bytes.forEach((byte) => { value += String.fromCharCode(byte); });
        return btoa(value).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }

      function decode(value) {
        const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
        const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
        const binary = atob(padded);
        return Uint8Array.from(binary, (character) => character.charCodeAt(0));
      }

      function deviceToken() {
        const key = "classpresence.device.v1";
        let value = localStorage.getItem(key);
        if (!value) {
          value = typeof crypto.randomUUID === "function"
            ? crypto.randomUUID()
            : base64url(crypto.getRandomValues(new Uint8Array(32)));
          localStorage.setItem(key, value);
        }
        return value;
      }

      function browserKeySupported() {
        return Boolean(window.crypto && window.crypto.subtle && window.indexedDB);
      }

      function openCredentialDatabase() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open("classpresence.credentials.v1", 1);
          request.onupgradeneeded = () => {
            if (!request.result.objectStoreNames.contains("keys")) {
              request.result.createObjectStore("keys", { keyPath: "credentialId" });
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error(copy("browserUnsupported")));
        });
      }

      async function loadBrowserKey(credentialId) {
        const database = await openCredentialDatabase();
        const record = await new Promise((resolve, reject) => {
          const request = database.transaction("keys", "readonly")
            .objectStore("keys").get(credentialId);
          request.onsuccess = () => resolve(request.result || null);
          request.onerror = () => reject(request.error);
        });
        database.close();
        return record;
      }

      async function signWithBrowserCredential(options) {
        if (!browserKeySupported()) throw new Error(copy("browserUnsupported"));
        const record = await loadBrowserKey(options.credentialId);
        if (!record || !record.privateKey) {
          const error = new Error(copy("browserCredentialMissing"));
          error.name = "CredentialMissingError";
          throw error;
        }
        const signature = await crypto.subtle.sign(
          { name: "ECDSA", hash: "SHA-256" },
          record.privateKey,
          decode(options.message),
        );
        return {
          credential_id: record.credentialId,
          signature: base64url(signature),
        };
      }

      function prepareOptions(options, action) {
        options.challenge = decode(options.challenge);
        if (action === "register") {
          options.user.id = decode(options.user.id);
          (options.excludeCredentials || []).forEach((item) => { item.id = decode(item.id); });
        } else {
          (options.allowCredentials || []).forEach((item) => { item.id = decode(item.id); });
        }
        return options;
      }

      function registrationCredential(credential) {
        return {
          id: credential.id,
          rawId: base64url(credential.rawId),
          type: credential.type,
          authenticatorAttachment: credential.authenticatorAttachment,
          clientExtensionResults: credential.getClientExtensionResults(),
          response: {
            attestationObject: base64url(credential.response.attestationObject),
            clientDataJSON: base64url(credential.response.clientDataJSON),
            transports: credential.response.getTransports ? credential.response.getTransports() : [],
          },
        };
      }

      function authenticationCredential(credential) {
        return {
          id: credential.id,
          rawId: base64url(credential.rawId),
          type: credential.type,
          authenticatorAttachment: credential.authenticatorAttachment,
          clientExtensionResults: credential.getClientExtensionResults(),
          response: {
            authenticatorData: base64url(credential.response.authenticatorData),
            clientDataJSON: base64url(credential.response.clientDataJSON),
            signature: base64url(credential.response.signature),
            userHandle: credential.response.userHandle
              ? base64url(credential.response.userHandle)
              : null,
          },
        };
      }

      async function reportCapability() {
        if (!componentArgs || reportedCapabilityOperation === componentArgs.operationId) return;
        reportedCapabilityOperation = componentArgs.operationId;
        const passkeySupported = Boolean(window.PublicKeyCredential && navigator.credentials);
        let platformAvailable = false;
        if (passkeySupported && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
          try {
            platformAvailable = await PublicKeyCredential
              .isUserVerifyingPlatformAuthenticatorAvailable();
          } catch (_error) {
            platformAvailable = false;
          }
        }
        setValue({
          operation_id: componentArgs.operationId,
          action: "capability",
          passkey_supported: passkeySupported,
          platform_available: platformAvailable,
          browser_key_supported: browserKeySupported(),
        });
      }

      function detailedError(error) {
        const name = error && error.name ? error.name : "Error";
        const detail = error && error.message ? error.message : copy("failed");
        return `${copy("failed")} ${name}: ${detail}`;
      }

      window.addEventListener("message", (event) => {
        if (event.data.type !== "streamlit:render") return;
        componentArgs = event.data.args;
        locale = componentArgs.locale === "en" ? "en" : "ar";
        document.documentElement.lang = locale;
        document.documentElement.dir = locale === "ar" ? "rtl" : "ltr";
        document.body.dir = document.documentElement.dir;
        const labels = {
          register: "register",
          authenticate: "verify",
          browser_authenticate: "browserVerify",
        };
        if (componentArgs.action === "capability") {
          button.style.display = "none";
          statusText.textContent = copy("checking");
          reportCapability();
        } else {
          button.style.display = "block";
          button.textContent = copy(labels[componentArgs.action] || "verify");
          statusText.textContent = copy(
            componentArgs.action === "register" ? "registerDescription" : "verifyDescription",
          );
        }
        setHeight();
      });

      async function performAction() {
        if (!componentArgs) return;
        const args = componentArgs;
        const action = args.action;
        const operationId = args.operationId;
        if (runningOperation === operationId) return;
        if (["register", "authenticate"].includes(action)
            && (!window.PublicKeyCredential || !navigator.credentials)) {
          setValue({
            operation_id: operationId,
            action,
            error_name: "NotSupportedError",
            error: copy("unsupported"),
            user_agent: navigator.userAgent,
            platform: navigator.userAgentData?.platform || navigator.platform || "",
          });
          return;
        }
        if (action === "browser_authenticate"
            && !browserKeySupported()) {
          setValue({
            operation_id: operationId,
            action,
            error: copy("browserUnsupported"),
          });
          return;
        }
        runningOperation = operationId;
        button.disabled = true;
        statusText.textContent = copy("waiting");
        setHeight();
        try {
          const options = JSON.parse(args.optionsJson || "{}");
          let result;
          if (action === "register" || action === "authenticate") {
            const prepared = prepareOptions(options, action);
            const credential = action === "register"
              ? await navigator.credentials.create({ publicKey: prepared })
              : await navigator.credentials.get({ publicKey: prepared });
            result = {
              credential: action === "register"
                ? registrationCredential(credential)
                : authenticationCredential(credential),
            };
          } else if (action === "browser_authenticate") {
            result = await signWithBrowserCredential(options);
          }
          setValue(Object.assign({
            operation_id: operationId,
            action,
            device_token: deviceToken(),
            origin: window.location.origin,
            hostname: window.location.hostname,
            user_agent: navigator.userAgent,
            platform: navigator.userAgentData?.platform || navigator.platform || "",
          }, result));
          statusText.textContent = copy("verified");
        } catch (error) {
          setValue({
            operation_id: operationId,
            action,
            device_token: deviceToken(),
            error_name: error && error.name ? error.name : "Error",
            error: detailedError(error),
            user_agent: navigator.userAgent,
            platform: navigator.userAgentData?.platform || navigator.platform || "",
          });
          statusText.textContent = copy("incomplete");
        } finally {
          runningOperation = null;
          button.disabled = false;
          setHeight();
        }
      }

      button.addEventListener("click", performAction);

      send("streamlit:componentReady", { apiVersion: 1 });
      setHeight();
    </script>
  </body>
</html>
