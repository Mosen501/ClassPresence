<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geolocation Capture</title>
    <style>
      body {
        margin: 0;
        font-family: "Noto Kufi Arabic", "Tahoma", "Space Grotesk", "Segoe UI", sans-serif;
        background: transparent;
        color: #f4f7fb;
      }
      .panel {
        border: 1px solid #253140;
        border-radius: 14px;
        background: #0f141c;
        padding: 14px;
      }
      button {
        width: 100%;
        border: none;
        border-radius: 10px;
        background: #c7f36b;
        color: #121807;
        padding: 12px 14px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #d4ff7b;
      }
      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }
      p {
        margin: 10px 0 0;
        font-size: 13px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <button id="captureButton" type="button">Share location</button>
      <p id="statusText">
        Location is used to confirm classroom distance.
      </p>
    </div>
    <script>
      const button = document.getElementById("captureButton");
      const statusText = document.getElementById("statusText");
      let locale = "en";
      const messages = {
        en: {
          description: "Location is used to confirm classroom distance.",
          unsupported: "This device does not support geolocation.",
          requesting: "Requesting device location...",
          captured: "Location captured. The app will validate the attendance stamp now.",
          unavailable: "Unable to retrieve your location.",
          denied: "Location access was denied. Allow location access and try again.",
          timeout: "Location request timed out. Try again.",
        },
        ar: {
          description: "يُستخدم الموقع للتحقق من وجودك داخل القاعة.",
          unsupported: "هذا الجهاز لا يدعم تحديد الموقع.",
          requesting: "جارٍ تحديد موقع الجهاز...",
          captured: "تم تحديد الموقع وسيتم التحقق منه الآن.",
          unavailable: "تعذر تحديد موقعك. حاول مرة أخرى.",
          denied: "تم رفض الوصول إلى الموقع. اسمح بالوصول ثم حاول مرة أخرى.",
          timeout: "انتهت مهلة تحديد الموقع. حاول مرة أخرى.",
        },
      };

      function copy(key) {
        return messages[locale][key];
      }

      function sendMessageToStreamlitClient(type, data) {
        const payload = Object.assign(
          {
            isStreamlitMessage: true,
            type: type,
          },
          data
        );
        window.parent.postMessage(payload, "*");
      }

      function setComponentValue(value) {
        sendMessageToStreamlitClient("streamlit:setComponentValue", { value });
      }

      function setFrameHeight(height) {
        sendMessageToStreamlitClient("streamlit:setFrameHeight", { height });
      }

      function initializeComponent() {
        sendMessageToStreamlitClient("streamlit:componentReady", { apiVersion: 1 });
        setFrameHeight(document.body.scrollHeight);
      }

      function setStatus(message) {
        statusText.textContent = message;
        setFrameHeight(document.body.scrollHeight);
      }

      function deviceToken() {
        const key = "classpresence.device.v1";
        let value = localStorage.getItem(key);
        if (!value) {
          value = typeof crypto.randomUUID === "function"
            ? crypto.randomUUID()
            : Array.from(crypto.getRandomValues(new Uint8Array(32)))
              .map((byte) => byte.toString(16).padStart(2, "0"))
              .join("");
          localStorage.setItem(key, value);
        }
        return value;
      }

      window.addEventListener("message", (event) => {
        if (event.data.type !== "streamlit:render") {
          return;
        }
        locale = event.data.args.locale === "en" ? "en" : "ar";
        document.documentElement.lang = locale;
        document.documentElement.dir = locale === "ar" ? "rtl" : "ltr";
        document.body.dir = document.documentElement.dir;
        const buttonLabel = event.data.args.buttonLabel || "Share location";
        button.textContent = buttonLabel;
        setStatus(copy("description"));
        setFrameHeight(document.body.scrollHeight);
      });

      button.addEventListener("click", () => {
        if (!navigator.geolocation) {
          const errorMessage = copy("unsupported");
          setStatus(errorMessage);
          setComponentValue({
            error: errorMessage,
            captured_at: new Date().toISOString(),
          });
          return;
        }

        button.disabled = true;
        setStatus(copy("requesting"));

        const readings = [];
        let completed = false;
        let watchId = null;
        let collectionTimer = null;

        const finish = (error = null) => {
          if (completed) return;
          completed = true;
          if (watchId !== null) navigator.geolocation.clearWatch(watchId);
          if (collectionTimer !== null) clearTimeout(collectionTimer);

          if (readings.length > 0) {
            const position = readings.reduce((best, candidate) => (
              candidate.coords.accuracy < best.coords.accuracy ? candidate : best
            ));
            const payload = {
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy_m: position.coords.accuracy,
              sample_count: readings.length,
              captured_at: new Date().toISOString(),
              user_agent: navigator.userAgent,
              platform: navigator.userAgentData?.platform || navigator.platform || "",
              language: navigator.language,
              timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
              screen_width: window.screen.width,
              screen_height: window.screen.height,
              device_token: deviceToken(),
            };
            setStatus(copy("captured"));
            setComponentValue(payload);
            button.disabled = false;
            return;
          }

          const message = error?.code === 1
            ? copy("denied")
            : error?.code === 3
              ? copy("timeout")
              : copy("unavailable");
          setStatus(message);
          setComponentValue({
            error: message,
            captured_at: new Date().toISOString(),
          });
          button.disabled = false;
        };

        watchId = navigator.geolocation.watchPosition(
          (position) => {
            readings.push(position);
            if (collectionTimer === null) {
              collectionTimer = setTimeout(() => finish(), 4000);
            }
            if (position.coords.accuracy <= 15 || readings.length >= 3) finish();
          },
          (error) => finish(error),
          {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0,
          }
        );
      });

      initializeComponent();
    </script>
  </body>
</html>
